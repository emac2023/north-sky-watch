name: Build North Sky Watch Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle live app into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp sw.js app/src/main/assets/sw.js
          cp icon.svg app/src/main/assets/icon.svg

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK to downloads
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/NorthSkyWatch.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthSkyWatch-Android
          path: downloads/NorthSkyWatch.apk
          if-no-files-found: error

      - name: Publish APK back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NorthSkyWatch.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Update North Sky Watch Android APK [skip ci]"
            git push
          fi
